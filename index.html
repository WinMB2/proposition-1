:root{--pink:#e83c8c;--dark:#85325b;--soft:#ffe8f3;--white:#fff;--ok:#257d54}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'PingFang HK','Noto Sans TC','Microsoft JhengHei',sans-serif;background:linear-gradient(145deg,#ffe4f1,#fff6fa 50%,#fbd9eb);color:#56304a;min-height:100vh}button,input{font:inherit}button{touch-action:manipulation;cursor:pointer}button:focus-visible{outline:3px solid #a52071;outline-offset:3px}.wrap{max-width:820px;margin:auto;padding:18px 14px 50px}.header{text-align:center;background:#fff9fd;border:3px solid #ffb8d6;border-radius:26px;padding:18px 10px;box-shadow:0 7px 0 #f8c2dc}.header .pill{background:#f9d1e4;border-radius:20px;padding:5px 14px;font-weight:800;font-size:14px}.header h1{margin:12px 0 6px;font-size:clamp(26px,5.7vw,42px);color:#cf2377}.header p{margin:0;font-weight:600}main{background:rgba(255,255,255,.92);margin-top:20px;border-radius:28px;border:3px solid #ffbfd9;box-shadow:0 7px 0 #f4bfda;padding:18px}.hide{display:none!important}.hero{text-align:center}.hero .big{font-size:70px;margin:10px}.hero p{font-size:19px;line-height:1.7}.name{font-size:22px;font-weight:800;display:block;margin:12px 0}.field{border:3px solid #f4a0c8;border-radius:16px;padding:14px;font-size:21px;width:100%;max-width:360px;text-align:center}.btn{border:0;border-radius:17px;background:#e93487;color:white;padding:13px 22px;font-size:19px;font-weight:900;box-shadow:0 5px 0 #b92e6d;min-height:50px}.btn:active{transform:translateY(2px);box-shadow:0 3px 0 #b92e6d}.btn.secondary{background:#fff1f7;color:#b82a71;border:2px solid #f4a3c8;box-shadow:none}.status{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:800;color:#b82a71}.progress{height:14px;border-radius:99px;background:#fce3f0;margin:12px 0 18px;overflow:hidden}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#ff83b3,#db3285);transition:width .3s}.question{text-align:center;font-size:clamp(21px,4.6v </style></head><body><div class="wrap"><header class="header"><span class="pill">🌸 小一數學 · 方向和位置（一）</span><h1>🎀 粉紅位置探險樂園</h1><p>20題 · 看圖選答案 · 廣東話讀題</p></header><main><section id="start" class="hero"><div class="big">🦄🎁🌷</div><h2>歡迎來到位置樂園！</h2><p>認識 <strong>左、右、上、下、前、後、之間</strong><br>完成四關，收集20顆星星！</p><label class="name" for="student">你的名字</label><input id="student" class="field" placeholder="輸入名字（可略過）" maxlength="24"><div class="controls"><button class="btn" id="startBtn">🌟 開始遊戲</button></div><p class="help">🔊 iPad：點擊「開始遊戲」或「讀出題目」後，才可啟用語音。<br>聲音取決於裝置是否提供廣東話語音。</p></section><section id="game" class="hide"><div class="status"><span id="stage">第一關</span><span id="count">第1／20題</span><span id="points">⭐ 0 分</span></div><div class="progress"><div id="bar"></div></div><div class="question" id="question"></div><div class="controls"><button id="speak" class="voice">🔊 讀出題目及選項</button><button id="mute" class="voice">🔈 自動讀題：開</button></div><div class="scene" id="scene" role="img" aria-label="題目圖片"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="controls"><button id="next" class="btn hide">下一題 ➜</button></div></section><section id="done" class="finish hide"><div style="font-size:72px">🏆🌸🎉</div><h2 id="congrats">完成所有挑戰！</h2><p class="sub" id="studentResult"></p><div class="score" id="finalScore">0 / 100</div><p id="comment" class="sub"></p><button id="restart" class="btn">🔄 再玩一次</button></section></main><div class="footer">學習重點：香港小一數學 1S3 方向和位置（一）｜圖片為原創簡化示意圖</div></div>
<script>
'use strict';
// All picture assets are locally embedded SVG. No network or external dependencies.
const Q=[
// Scene type, prompt, choices, correct index
['gifts','藍色圓形禮物在桌子的哪一面？',['左','右'],0],
['gifts','白色長方形禮物在桌子的哪一面？',['左','右'],1],
['gifts','哪份禮物在兩份禮物之間？',['藍色禮物','灰色禮物','白色禮物'],1],
['gifts','桌子上共有多少份禮物？',['2份','3份','4份'],1],
['gifts','灰色禮物在白色禮物的哪一面？',['左','右'],0],
['bed','時鐘在小猴子的哪一面？',['上','下'],0],
['bed','小貓在小猴子的哪一面？',['上','下'],1],
['bed','誰在小猴子的下面？',['時鐘','小貓','小鳥'],1],

['bed','在時鐘和小貓之間的是誰？',['小猴子','小老鼠'],0],
['line','戴藍色頭盔的小朋友在隊伍的哪一面？',['前','後'],0],
['line','戴眼鏡的小朋友在隊伍的哪一面？',['前','後'],1],
['line','穿白色衣服的小朋友在戴眼鏡小朋友的哪一面？',['前','後'],0],
['line','穿粉紅衣服的小朋友在藍衣服和白衣服的小朋友之間嗎？',['是','不是'],0],
['line','哪一位小朋友在隊伍最後面？',['藍衣服','粉紅衣服','戴眼鏡'],2],
['shelf','藍色水杯在茶杯的哪一面？',['左','右'],0],
['shelf','綠色杯子在茶杯的哪一面？',['左','右'],1],
['shelf','黃色水壺在茶杯的哪一面？',['上','下'],1],
['shelf','哪個物件在藍色水杯和綠色杯子之間？',['茶杯','水壺','蘋果'],0],
['shelf','茶杯在黃色水壺的哪一面？',['上','下'],0]
];
const stages=['🎁 第一關：左右與之間','🛏️ 第二關：上下與之間','🛴 第三關：前後與之間','☕ 第四關：綜合位置挑戰'];
let index=0,score=0,autoVoice=true,answered=false,studentName='';
const el=id=>document.getElementById(id), svgStart='<svg viewBox="0 0 600 265" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">',end='</svg>';
function gifts(){return svgStart+`<ellipse cx="300" cy="187" rx="270" ry="60" fill="#fff" stroke="#d58cae" stroke-width="5"/><path d="M65 186v47M535 186v47" stroke="#af8399" stroke-width="12" stroke-linecap="round"/><g transform="translate(120 83)"><ellipse cx="55" cy="110" rx="64" ry="13" fill="#dfe9ee"/><rect x="5" y="31" width="100" height="78" rx="9" fill="#65b6eb" stroke="#317db2" stroke-width="3"/><rect x="46" y="31" width="13" height="78" fill="white"/><ellipse cx="55" cy="32" rx="50" ry="16" fill="#91d5f5" stroke="#317db2" stroke-width="3"/><path d="M55 34C-9 -4 25 -19 55 22C85 -19 119 -4 55 34" fill="none" stroke="white" stroke-width="9"/></g><g transform="translate(265 96)"><rect x="0" y="25" width="80" height="78" fill="#d3d8e3" stroke="#7c8191" stroke-width="3"/><path d="M0 25L37 0 117 20 80 46Z" fill="#e9ecf5" stroke="#7c8191" stroke-width="3"/><path d="M80 46L117 20V95L80 103Z" fill="#aeb7c7" stroke="#7c8191" stroke-width="3"/><path d="M36 13Q57 -10 67 12Q44 36 36 13" fill="#e54e9a"/></g><g transform="translate(415 88)"><rect x="2" y="34" width="122" height="75" fill="#fff" stroke="#7d9bb0" stroke-width="3"/><path d="M2 34L38 4 160 13 124 45Z" fill="#fbfdff" stroke="#7d9bb0" stroke-width="3"/><path d="M124 45L160 13V87L124 109Z" fill="#e5e8ed" stroke="#7d9bb0" stroke-width="3"/><path d="M67 10L47 39V109" fill="none" stroke="#2cafe4" stroke-width="10"/><path d="M73 10Q25 -14 44 12Q65 36 73 10Q113 -14 108 12Q100 31 73 10" fill="#50c4f0" stroke="#2293ce" stroke-width="3"/></g><text x="65" y="45" fill="#c33284" font-size="25" font-weight="bold">左</text><text x="518" y="45" fill="#c33284" font-size="25" font-weight="bold">右</text>`+end}
function bed(){return svgStart+`<path d="M100 218h420" stroke="#bd9ba8" stroke-width="10" stroke-linecap="round"/><rect x="125" y="80" width="365" height="18" rx="6" fill="#ad8399"/><rect x="125" y="169" width="365" height="18" rx="6" fill="#ad8399"/><path d="M140 80V236M475 80V236" stroke="#9d8191" stroke-width="13"/><rect x="153" y="102" width="300" height="56" rx="8" fill="#bbdcf6"/><rect x="153" y="190" width="300" height="40" rx="8" fill="#b0d9f2"/><path d="M153 133Q240 100 320 137T453 128" stroke="#fff" stroke-width="8" fill="none"/><path d="M153 214Q240 185 320 214T453 207" stroke="#fff" stroke-width="8" fill="none"/><g transform="translate(295 8)"><circle cx="0" cy="40" r="32" fill="#f5d5e6" stroke="#aa6a91" stroke-width="4"/><circle cx="0" cy="40" r="23" fill="white"/><path d="M0 40V25M0 40L14 49" stroke="#5c6886" stroke-width="4" stroke-linecap="round"/><path d="M-18 11l-13 -8M18 11l13 -8" stroke="#aa6a91" stroke-width="4"/></g><g transform="translate(285 119)"><circle cx="-29" cy="0" r="12" fill="#b6a0dc"/><circle cx="29" cy="0" r="12" fill="#b6a0dc"/><circle r="29" fill="#b6a0dc"/><ellipse cx="0" cy="13" rx="15" ry="12" fill="#fff2e5"/><circle cx="-11" cy="-4" r="4"/><circle cx="11" cy="-4" r="4"/><ellipse cx="0" cy="12" rx="5" ry="4" fill="#a65d8e"/></g><g transform="translate(284 206)"><path d="M-43 8Q-40 -24 -5 -21Q38 -23 41 8Z" fill="#e6d4c4" stroke="#957d78" stroke-width="3"/><path d="M-30 -13l-10 -16 22 10M21 -19l20 -11 -1 22" fill="#e6d4c4" stroke="#957d78" stroke-width="3"/><circle cx="-12" cy="-7" r="3"/><circle cx="13" cy="-7" r="3"/><path d="M-5 3q5 6 10 0" fill="none" stroke="#957d78" stroke-width="2"/></g><g transform="translate(290 247)"><ellipse rx="34" ry="10" fill="#b9aabd"/><circle cx="-21" cy="-8" r="9" fill="#aaa"/><circle cx="-11" cy="-18" r="5" fill="#aaa"/><path d="M14 -8q28 -25 39 1" stroke="#aaa" stroke-width="5" fill="none"/><circle cx="-26" cy="-10" r="2"/></g><text x="33" y="47" font-size="23" fill="#c33284" font-weight="bold">上</text><text x="35" y="238" font-size="23" fill="#c33284" font-weight="bold">下</text>`+end}
function line(){let a=svgStart+`<path d="M16 207h570" stroke="#d8c1d0" stroke-width="7" stroke-linecap="round"/><path d="M45 195l-22 12 22 12" stroke="#b6759e" stroke-width="5" fill="none"/><text x="27" y="43" font-size="24" font-weight="bold" fill="#c33284">前</text><text x="532" y="43" font-size="24" font-weight="bold" fill="#c33284">後</text>`;let xs=[85,226,367,508],cloth=['#64b8eb','#f1a0cb','#fff','#c5c5d9'];for(let i=0;i<4;i++){let x=xs[i];a+=`<g transform="translate(${x} 91)"><rect x="-38" y="91" width="77" height="14" rx="7" fill="#91cdeb"/><circle cx="-23" cy="110" r="9" fill="#627c91"/><circle cx="23" cy="110" r="9" fill="#627c91"/><path d="M-22 63l-8 26m54-26l6 26" stroke="#69617a" stroke-width="8" stroke-linecap="round"/><rect x="-28" y="40" width="55" height="37" rx="14" fill="${cloth[i]}" stroke="#8490a5" stroke-width="2"/><circle cx="0" cy="11" r="29" fill="#ffdbbb" stroke="#b78976" stroke-width="2"/><path d="M-28 8q-3 -39 27 -39q32 0 29 39Z" fill="${i===3?'#8d87a1':'#62b2e3'}"/><path d="M-29 5Q0 -9 29 5" fill="none" stroke="#fff" stroke-width="5"/><circle cx="-10" cy="14" r="3"/><circle cx="10" cy="14" r="3"/><path d="M-8 25Q0 31 8 25" stroke="#ae6871" stroke-width="2" fill="none"/>${i===3?'<circle cx="-10" cy="14" r="9" fill="none" stroke="#555" stroke-width="2"/><circle cx="10" cy="14" r="9" fill="none" stroke="#555" stroke-width="2"/><path d="M-1 14h2" stroke="#555" stroke-width="2"/>':''}</g>`;}return a+end}
function shelf(){return svgStart+`<rect x="60" y="28" width="480" height="224" rx="12" fill="#b2a8b2" stroke="#786e81" stroke-width="5"/><rect x="80" y="48" width="440" height="70" rx="4" fill="#fff9fd"/><rect x="80" y="135" width="440" height="97" rx="4" fill="#fff9fd"/><path d="M72 127H528M72 239H528" stroke="#7e7483" stroke-width="13"/><g transform="translate(150 56)"><rect x="-29" y="13" width="58" height="55" rx="7" fill="#7fc8ed" stroke="#4389a6" stroke-width="3"/><ellipse cx="0" cy="13" rx="29" ry="8" fill="#eaf7ff" stroke="#4389a6" stroke-width="3"/><path d="M-5 18V65" stroke="white" stroke-width="8"/></g><g transform="translate(300 77)"><path d="M-29 0v28q0 21 29 21t29 -21V0Z" fill="#f8fcff" stroke="#4899ba" stroke-width="4"/><ellipse cx="0" cy="0" rx="29" ry="8" fill="#daeff9" stroke="#4899ba" stroke-width="3"/><path d="M29 10q24 -8 20 11q-3 15 -20 7" stroke="#4899ba" stroke-width="5" fill="none"/><ellipse cx="0" cy="50" rx="42" ry="7" fill="#90c9e6" stroke="#4899ba" stroke-width="3"/></g><g transform="translate(442 55)"><rect x="-29" y="10" width="54" height="62" rx="8" fill="#9fdfb9" stroke="#4e9c75" stroke-width="3"/><ellipse cx="-2" cy="10" rx="27" ry="8" fill="#d6f7df" stroke="#4e9c75" stroke-width="3"/><path d="M25 25q25 -9 25 14q0 18 -25 8" stroke="#4e9c75" stroke-width="5" fill="none"/></g><g transform="translate(300 148)"><path d="M-37 28Q-41 5 -21 5H23Q43 5 37 28V69H-37Z" fill="#ffe590" stroke="#cba44c" stroke-width="3"/><path d="M-22 6V-7h42V6" stroke="#cba44c" stroke-width="8" fill="none"/><path d="M35 27q23 -3 23 14t-23 12" stroke="#cba44c" stroke-width="6" fill="none"/></g><text x="28" y="37" fill="#c33284" font-size="22" font-weight="bold">上</text><text x="28" y="234" fill="#c33284" font-size="22" font-weight="bold">下</text>`+end}
const pictures={gifts,bed,line,shelf};
function stop(){if('speechSynthesis' in window){try{speechSynthesis.cancel()}catch(e){}}}
function speakText(text){if(!('speechSynthesis' in window))return;try{stop();let u=new SpeechSynthesisUtterance(text);u.lang='zh-HK';u.rate=.78;u.pitch=1.08;let vs=speechSynthesis.getVoices();let v=vs.find(x=>x.lang.toLowerCase()==='zh-hk')||vs.find(x=>/cantonese|hong kong/i.test(x.name))||vs.find(x=>x.lang.startsWith('zh'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function readQuestion(){const q=Q[index],letters=['A','B','C','D'];speakText('第'+(index+1)+'題。'+q[1]+'。'+q[2].map((t,i)=>letters[i]+'，'+t).join('。'))}
function render(){answered=false;const q=Q[index];el('game').classList.remove('hide');el('start').classList.add('hide');el('done').classList.add('hide');el('stage').textContent=stages[Math.floor(index/5)];el('count').textContent='第 '+(index+1)+'／20 題';el('points').textContent='⭐ '+score+' 分';el('bar').style.width=(index/20*100)+'%';el('question').textContent=q[1];el('scene').innerHTML=pictures[q[0]]();el('answers').innerHTML='';el('feedback').textContent='選出正確答案吧！';el('next').classList.add('hide');q[2].forEach((opt,i)=>{const b=document.createElement('button');b.type='button';b.className='choice';const l=document.createElement('span');l.className='letter';l.textContent='ABCD'[i];const t=document.createElement('span');t.textContent=opt;b.append(l,t);b.addEventListener('click',()=>choose(i));el('answers').appendChild(b)});if(autoVoice)setTimeout(readQuestion,250)}
function choose(i){if(answered)return;answered=true;stop();const q=Q[index],correct=i===q[3],buttons=[...el('answers').children];buttons.forEach((b,k)=>{b.disabled=true;if(k===q[3])b.classList.add('good');else if(k===i)b.classList.add('bad')});if(correct){score+=5;el('feedback').textContent='✅ 答對了！你得到一顆星星！';speakText('答對了！真叻！')}else{el('feedback').textContent='💗 再記住：正確答案是 '+('ABCD'[q[3]])+'．'+q[2][q[3]];speakText('正確答案是，'+q[2][q[3]])}el('points').textContent='⭐ '+score+' 分';el('next').textContent=index===19?'🏆 看看我的成績':'下一題 ➜';el('next').classList.remove('hide');}
function finish(){stop();el('game').classList.add('hide');el('done').classList.remove('hide');el('finalScore').textContent=score+' / 100';el('studentResult').textContent=(studentName?studentName+'，':'')+'你已完成20題！';el('comment').textContent=score===100?'全對！位置小博士！ 🌟':score>=80?'做得很好！繼續加油！ 🌷': '完成挑戰！再練習會更進步！ 🌈';}
el('startBtn').addEventListener('click',()=>{studentName=el('student').value.trim();index=0;score=0;autoVoice=true;el('mute').textContent='🔈 自動讀題：開';render()});el('speak').addEventListener('click',readQuestion);el('mute').addEventListener('click',()=>{autoVoice=!autoVoice;el('mute').textContent='🔈 自動讀題：'+(autoVoice?'開':'關');if(!autoVoice)stop();else readQuestion()});el('next').addEventListener('click',()=>{if(!answered)return;if(index<19){index++;render()}else finish()});el('restart').addEventListener('click',()=>{index=0;score=0;render()});window.addEventListener('pagehide',stop);
</script></body></html>
